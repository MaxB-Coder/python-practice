[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bank"
version = "0.1.0"
description = "A small bank account class"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "black",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
